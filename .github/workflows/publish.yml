name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      # tag 与 package.json 的 version 必须一致：对不上就中止，
      # 否则会把 latest 指到错版本（npm 不允许重发同版本号，只能再升一版补救）
      - name: 校验 tag 与 package.json version 一致
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const v=require('./package.json').version; const tag=process.env.TAG; if ('v'+v!==tag) { console.error('tag/version mismatch: tag='+tag+' version='+v); process.exit(1); } console.log('tag 与 version 一致:', tag);"
      - run: npm publish --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # npm 包发出去之后再建 GitHub Release（标题同 tag，正文按提交自动生成）；
      # tag 被重推时 release 可能已存在，存在就跳过而不是让 job 变红
      - name: Create GitHub Release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, skip"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi